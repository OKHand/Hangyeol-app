name: Client development packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build one platform only
        type: choice
        options: [android, windows]
        required: true
      mode:
        description: Package mode (online builds signed release packages)
        type: choice
        options: [online, offline]
        required: true
permissions:
  contents: read
concurrency:
  group: client-package-${{ inputs.platform }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'OKHand/Hangyeol-app' && github.ref == 'refs/heads/main' && github.actor == 'OKHand'
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      PACKAGE_MODE: ${{ inputs.mode }}
      APPS_SCRIPT_API_URL: ${{ vars.APPS_SCRIPT_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inputs and version before downloading build tools
        shell: python
        run: |
          import json, os, pathlib, re
          if not pathlib.Path('apps/flutter_shell/pubspec.lock').is_file():
              raise SystemExit('Reviewed pubspec.lock is required before packaging.')
          pubspec = pathlib.Path('apps/flutter_shell/pubspec.yaml').read_text()
          m = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$', pubspec, re.M)
          if not m:
              raise SystemExit('Expected numbered version in pubspec.yaml.')
          version = m.group(1)
          build_num = 45 + int(os.environ['GITHUB_RUN_NUMBER'])
          online = os.environ['PACKAGE_MODE'] == 'online'
          url = os.environ.get('APPS_SCRIPT_API_URL', '')
          if online and not re.fullmatch(r'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec', url):
              raise SystemExit('Set the existing public API URL in repository variables; no Google credentials are used.')
          cfg = {'SERVERLESS':'true', 'APPS_SCRIPT_API_URL':url, 'APP_VERSION':version, 'APP_BUILD_NUMBER':str(build_num)} if online else {'OFFLINE_DEMO':'true', 'APP_VERSION':version, 'APP_BUILD_NUMBER':str(build_num)}
          pathlib.Path('config/online.json').write_text(json.dumps(cfg))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'APP_VERSION={version}\nAPP_BUILD_NUMBER={build_num}\n')
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('.flutter-version') }}
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('.flutter-version', 'apps/flutter_shell/pubspec.lock') }}
      - name: Prepare Android runner
        if: inputs.platform == 'android'
        working-directory: apps/flutter_shell
        shell: bash
        run: |
          bash tool/bootstrap.sh
          if [[ "$PACKAGE_MODE" == online ]]; then
            python3 tool/prepare_serverless_android.py
          else
            python3 tool/prepare_offline_android.py
          fi
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/flutter_shell/android/**/*.gradle*
            apps/flutter_shell/android/**/gradle-wrapper.properties
            apps/flutter_shell/pubspec.lock
            .flutter-version
      - name: Configure fixed Android release signing
        if: inputs.platform == 'android' && inputs.mode == 'online'
        working-directory: apps/flutter_shell
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "Fixed Android signing secrets are required for online release builds." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/hangyeol-release.p12"
          password_path="$RUNNER_TEMP/hangyeol-release.pass"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$password_path"
          chmod 600 "$keystore_path" "$password_path"
          export HANGYEOL_ANDROID_KEYSTORE="$keystore_path"
          export HANGYEOL_ANDROID_PASSWORD_FILE="$password_path"
          python3 tool/configure_android_signing.py
          echo "HANGYEOL_ANDROID_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"
          echo "HANGYEOL_ANDROID_PASSWORD_FILE=$password_path" >> "$GITHUB_ENV"
      - name: Prepare Windows runner
        if: inputs.platform == 'windows'
        working-directory: apps/flutter_shell
        shell: pwsh
        run: |
          ./tool/bootstrap.ps1
          if ($env:PACKAGE_MODE -eq 'online') { ./tool/prepare_serverless_windows.ps1 }
      - name: Analyze and test once
        working-directory: apps/flutter_shell
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub --timeout 2m
      - name: Build and verify signed release Android APK
        if: inputs.platform == 'android' && inputs.mode == 'online'
        working-directory: apps/flutter_shell
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub --build-name="$APP_VERSION" --build-number="$APP_BUILD_NUMBER" --dart-define-from-file=../../config/online.json
          apk_file="build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt_dir="$(ls -1d "$sdk_root/build-tools/"* | sort -V | tail -n 1)"
          cert_sha="$("$bt_dir/apksigner" verify --print-certs "$apk_file" | grep -oE 'certificate SHA-256 digest: [0-9a-fA-F:]+' | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')"
          if [[ "$cert_sha" != "84fc6fb951f82620868f662a30477a589bf39fc5bc7100d387cb737a8e75e8fc" ]]; then
            echo "APK signer certificate mismatch: $cert_sha" >&2
            exit 1
          fi
          badging="$("$bt_dir/aapt" dump badging "$apk_file" | head -n 1)"
          if [[ "$badging" != *"name='com.hangyeolseed.platform_online'"* || "$badging" != *"versionCode='$APP_BUILD_NUMBER'"* ]]; then
            echo "APK package or versionCode mismatch: $badging" >&2
            exit 1
          fi
          cp "$apk_file" "$RUNNER_TEMP/hangyeol-online.apk"
      - name: Build offline demo Android APK
        if: inputs.platform == 'android' && inputs.mode == 'offline'
        working-directory: apps/flutter_shell
        shell: bash
        run: |
          flutter build apk --debug --no-pub --dart-define-from-file=../../config/online.json
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/hangyeol-online.apk"
      - name: Clean temporary Android signing material
        if: always() && inputs.platform == 'android'
        shell: bash
        run: rm -f "$RUNNER_TEMP/hangyeol-release.p12" "$RUNNER_TEMP/hangyeol-release.pass"
      - name: Build Windows package
        if: inputs.platform == 'windows'
        working-directory: apps/flutter_shell
        shell: pwsh
        run: |
          flutter build windows --release --no-pub "--build-name=$env:APP_VERSION" "--build-number=$env:APP_BUILD_NUMBER" --dart-define-from-file=../../config/online.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed; no compiler retry.' }
          if ($env:PACKAGE_MODE -eq 'online') {
            ./tool/package_online_windows.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'package')
          } else {
            New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'package') | Out-Null
            Copy-Item build/windows/x64/runner/Release (Join-Path $env:RUNNER_TEMP 'package/HangyeolDemo') -Recurse
          }
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'android'
        with:
          name: android-${{ inputs.mode }}-release-${{ env.APP_BUILD_NUMBER }}
          path: ${{ runner.temp }}/hangyeol-online.apk
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'windows'
        with:
          name: windows-${{ inputs.mode }}-release-${{ env.APP_BUILD_NUMBER }}
          path: ${{ runner.temp }}/package
          retention-days: 3
          if-no-files-found: error
