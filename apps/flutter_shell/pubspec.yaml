publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_windows: ^0.4.0
  exif: ^3.3.0
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  geolocator: ^13.0.2
  path_provider: ^2.1.5
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
flutter:
  uses-material-design: true
